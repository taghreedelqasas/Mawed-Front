<div class="page-wrapper">
  
  <!-- Left Panel: Image -->
  <div class="image-panel"></div>

  <!-- Right Panel: Form -->
  <div class="form-panel">
    <div class="form-container">

      <!-- Logo -->
      <div class="logo">
        <div class="logo-icon">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <rect x="4" y="4" width="14" height="14" rx="3" stroke="#6C3FC5" stroke-width="2.2"/>
            <rect x="22" y="4" width="14" height="14" rx="3" stroke="#00C2CB" stroke-width="2.2"/>
            <rect x="4" y="22" width="14" height="14" rx="3" stroke="#00C2CB" stroke-width="2.2"/>
            <rect x="22" y="22" width="14" height="14" rx="3" stroke="#6C3FC5" stroke-width="2.2"/>
            <line x1="11" y1="18" x2="11" y2="22" stroke="#6C3FC5" stroke-width="2.2"/>
            <line x1="29" y1="18" x2="29" y2="22" stroke="#00C2CB" stroke-width="2.2"/>
            <line x1="18" y1="11" x2="22" y2="11" stroke="#00C2CB" stroke-width="2.2"/>
            <line x1="18" y1="29" x2="22" y2="29" stroke="#6C3FC5" stroke-width="2.2"/>
          </svg>
        </div>
        <span class="logo-text">Maw<span class="logo-accent">3</span>ed</span>
      </div>

      <!-- Header -->
      <div class="header-section">
        <h1 class="page-title">نسيت كلمة المرور</h1>
        <p class="page-subtitle">أدخل بريدك الإلكتروني وسنرسل لك رابط لإعادة تعيين كلمة المرور</p>
      </div>

      <!-- Form -->
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate>

        <!-- Email -->
        <div class="field-group">
          <label>البريد الإلكتروني<span class="req">*</span></label>
          <input formControlName="email" type="email"
            placeholder="name@example.com"
            [class.invalid]="isInvalid('email')" />
          <span class="error-msg" *ngIf="isInvalid('email')">
            {{ forgotPasswordForm.get('email')?.errors?.['required'] ? 'البريد الإلكتروني مطلوب' : 'البريد الإلكتروني غير صحيح' }}
          </span>
        </div>

        <!-- Success Message -->
        <div class="success-msg" *ngIf="successMessage">
          <i class="fas fa-check-circle"></i>
          {{ successMessage }}
        </div>

        <!-- API Error -->
        <div class="api-error" *ngIf="apiError">{{ apiError }}</div>

        <!-- Submit -->
        <button class="submit-btn" type="submit" [disabled]="isLoading">
          <span *ngIf="!isLoading">إرسال</span>
          <span *ngIf="isLoading" class="spinner"></span>
        </button>

      </form>

      <!-- Back to Login -->
      <p class="back-link">
        <a routerLink="/auth/login">العودة إلى تسجيل الدخول</a>
      </p>

    </div>
  </div>

</div>
